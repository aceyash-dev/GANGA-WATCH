    fill="url(#drop)"/>

  <path
    d="M43 156c22-29 51-39 77-43 35-5 57-16 63-39 10 20 19 39 24 55-13 31-40 49-73 50-38 1-63 14-81 36-12-13-16-32-10-59z"
    fill="url(#wave)"/>

  <path
    d="M58 111c20-27 45-55 63-82 12 24 29 47 39 68-14 20-36 31-62 36-17 3-29 9-42 18-5-13-4-25 2-40z"
    fill="#76E5FF"
    opacity=".22"/>

  <ellipse
    cx="91" cy="91" rx="12" ry="30"
