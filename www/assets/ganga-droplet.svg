<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" role="img" aria-labelledby="title desc">
  <title id="title">Ganga Watch blue droplet</title>
  <desc id="desc">A stylized blue water droplet with flowing river bands.</desc>
  <defs>
    <linearGradient id="drop" x1="58" y1="34" x2="205" y2="226" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#61D8FF"/>
      <stop offset="0.42" stop-color="#168BFF"/>
      <stop offset="1" stop-color="#063CBA"/>
    </linearGradient>
    <linearGradient id="wave" x1="42" y1="108" x2="211" y2="194" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#B9F4FF" stop-opacity=".96"/>
      <stop offset=".48" stop-color="#35B8FF" stop-opacity=".72"/>
      <stop offset="1" stop-color="#0B5BEA" stop-opacity=".18"/>
    </linearGradient>
    <linearGradient id="shine" x1="72" y1="54" x2="112" y2="120" gradientUnits="userSpaceOnUse">
      <stop stop-color="#FFFFFF" stop-opacity=".92"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity=".06"/>
    </linearGradient>
    <filter id="soft" x="-30%" y="-30%" width="160%" height="160%">
